name: Smoke Tests Staging

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    env:
      STAGING_URL: https://library-pos-staging.up.railway.app
    steps:
      - name: Wait for deployment to be ready
        run: |
          echo "Waiting 30s for Railway deployment to stabilize..."
          sleep 30

      - name: Check reachable
        run: |
          echo "Checking reachable: $STAGING_URL"
          curl -sf "$STAGING_URL" > /dev/null
          echo "✅ Reachable"

      - name: Check health endpoint
        run: |
          echo "Checking health: $STAGING_URL/health"
          response=$(curl -sf "$STAGING_URL/health")
          echo "$response" | grep -q '"status":"ok"'
          echo "✅ Health OK: $response"

      - name: Check config.js contains staging
        run: |
          echo "Checking config.js: $STAGING_URL/config.js"
          config=$(curl -sf "$STAGING_URL/config.js")
          echo "$config" | grep -q "staging"
          echo "✅ Config contains staging"

      - name: Check SPA fallback
        run: |
          echo "Checking SPA fallback: $STAGING_URL/smoke-test-route"
          code=$(curl -s -o /dev/null -w "%{http_code}" "$STAGING_URL/smoke-test-route")
          if [ "$code" = "200" ]; then
            echo "✅ SPA fallback OK (200)"
          else
            echo "❌ SPA fallback failed (code: $code)"
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          echo "Smoke tests completed for $STAGING_URL"